services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "http.server", "80"]
    ports: ["3000:80"]
    volumes:
      - ./:/app:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; assert b'three.min.js' in u.urlopen('http://127.0.0.1/', timeout=3).read()\""]
      interval: 10s
      timeout: 3s
      retries: 3
